<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Authentication - Ransomware Detection Simulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at top, #111e38 0%, #0a0f1d 70%);
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background-color: #0d1424;
            border: 1px solid #1e293b;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-info-subtle border border-info mb-3">
                <i class="bi bi-shield-lock-fill fs-1 text-info"></i>
            </div>
            <h4 class="fw-bold text-white mb-1">Ransomware Detection SOC</h4>
            <div class="text-muted small">CSE AI/ML Major Project Simulation Platform</div>
        </div>

        <div id="loginAlert" class="alert alert-danger py-2 small d-none" role="alert"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label for="username" class="form-label text-light small fw-semibold">Operator Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" class="form-control form-control-cyber" placeholder="Enter username" required value="admin">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-light small fw-semibold">Security Access Key / Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-key"></i></span>
                    <input type="password" id="password" class="form-control form-control-cyber" placeholder="Enter password" required value="admin123">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-info w-100 fw-bold py-2 mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Authenticate & Enter SOC
            </button>
        </form>

        <!-- Quick 1-Click Demo Buttons for Faculty Reviewers -->
        <div class="border-top border-secondary border-opacity-50 pt-3">
            <div class="text-muted text-uppercase fw-semibold mb-2" style="font-size: 0.7rem; letter-spacing: 0.05em;">
                Quick Demo Credentials (1-Click Fill)
            </div>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-outline-info flex-fill" onclick="fillCreds('admin', 'admin123')">
                    <i class="bi bi-shield-fill-check me-1"></i> Admin (Lead SOC)
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary flex-fill text-light" onclick="fillCreds('analyst', 'cyber2026')">
                    <i class="bi bi-person-badge me-1"></i> Analyst (demo)
                </button>
            </div>
            <div class="text-warning-subtle small mt-2" style="font-size: 0.72rem;">
                <i class="bi bi-info-circle me-1"></i> Academic demonstration only. Do not use default credentials in production environments.
            </div>
        </div>
    </div>

    <script>
        function fillCreds(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const alertBox = document.getElementById('loginAlert');
            const submitBtn = document.getElementById('submitBtn');
            alertBox.classList.add('d-none');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Authenticating...';

            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = '/dashboard';
                } else {
                    alertBox.textContent = data.message || 'Invalid credentials.';
                    alertBox.classList.remove('d-none');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Authenticate & Enter SOC';
                }
            } catch (err) {
                alertBox.textContent = 'Connection error. Ensure the Flask server is running.';
                alertBox.classList.remove('d-none');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Authenticate & Enter SOC';
            }
        }
    </script>
</body>
</html>
